[package]
name = "rapidraw-edit-model"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Validated recipe envelope, bounded semantic parameters, migrations, canonical serialization/hash, and generated frontend contract for the RapidRAW/Lap development engine."
publish = false

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.11"
hex = "0.4"
